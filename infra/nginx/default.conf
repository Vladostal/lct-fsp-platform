# Конфигурация nginx сервиса web (Арх. 2.1, 10.1, 10.2) — ШАБЛОН.
#
# compose монтирует файл как /etc/nginx/templates/default.conf.template; при старте контейнера образ nginx
# подставляет переменные окружения вида ${ИМЯ} и кладёт результат в /etc/nginx/conf.d/default.conf.
# Переменные nginx ($remote_addr, $uri …) подстановка не трогает: заменяются только имена из окружения.
#
#   ${API_UPSTREAM}, ${MAILPIT_UPSTREAM}  — адреса сервисов (api:8000, mailpit:8025; заданы в образе);
#   ${NGINX_LOCAL_RESOLVERS}              — DNS контейнера (образ nginx берёт его из /etc/resolv.conf).
#
# Условные части готовит скрипт образа /docker-entrypoint.d/15-fsp-conditional.sh (frontend/Dockerfile):
#   /etc/nginx/fsp/real-ip.conf    — set_real_ip_from и real_ip_header, если задан NGINX_REAL_IP_FROM;
#   /etc/nginx/fsp/mail-auth.conf  — базовая авторизация /mail/, если заданы MAIL_UI_USER и MAIL_UI_PASSWORD;
#   /usr/share/nginx/html/app-config.js — APP_NAME и MAILPIT_PUBLIC_URL для интерфейса.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Имена сервисов разрешаются при запросе, а не один раз при старте: после перезапуска api получает новый
    # адрес, и nginx с адресом, запомненным на старте, отвечал бы 502 до собственного перезапуска.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    # Адрес клиента. Без внешнего прокси $remote_addr — адрес соединения. За прокси с HTTPS (NGINX_REAL_IP_FROM)
    # файл содержит set_real_ip_from и real_ip_header X-Forwarded-For: $remote_addr становится адресом
    # настоящего клиента, иначе все посетители делили бы один лимит (Арх. 10.1).
    include /etc/nginx/fsp/real-ip.conf;

    server_tokens off;
    charset utf-8;
    # Перенаправления — относительные: снаружи стенд опубликован на другом порту (8080) и, возможно, по HTTPS.
    absolute_redirect off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # ── API платформы и демо-ФСП ───────────────────────────────────────────────────────────────────────────────────
    location /api/ {
        set $api_upstream http://${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        # X-Real-IP выставляется всегда и перезаписывает пришедшее снаружи: приложение принимает этот заголовок
        # только от nginx (TRUSTED_PROXY_CIDRS) и считает его адресом клиента для лимитов входа и регистрации.
        # X-Forwarded-For тоже перезаписывается, а не дополняется: цепочка, присланная клиентом, не доверенная.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Резюме в PDF — до 5 МБ (Арх. 10.7); запас на обёртку multipart.
        client_max_body_size 6m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Почтовый ящик стенда (Mailpit с MP_WEBROOT=/mail) ──────────────────────────────────────────────────────────
    location = /mail {
        return 301 /mail/;
    }

    location /mail/ {
        # На публичном стенде — базовая авторизация: иначе посетитель читал бы чужие ссылки подтверждения.
        include /etc/nginx/fsp/mail-auth.conf;

        set $mail_upstream http://${MAILPIT_UPSTREAM};
        proxy_pass $mail_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Веб-ящик обновляется по WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # ── Проверка готовности контейнера ─────────────────────────────────────────────────────────────────────────────
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── Статика SPA ────────────────────────────────────────────────────────────────────────────────────────────────
    # Файлы сборки с хешем в имени не меняются: кэш на год.
    location /assets/ {
        include /etc/nginx/fsp/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Настройки стенда пишутся при старте контейнера — кэшировать нельзя.
    location = /app-config.js {
        include /etc/nginx/fsp/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Маршруты приложения обслуживает index.html; он не кэшируется, чтобы после обновления стенда браузер сразу
    # получил ссылки на новые файлы сборки.
    location / {
        include /etc/nginx/fsp/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
