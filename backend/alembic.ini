# Alembic (Арх. 13.4): синхронный драйвер; адрес базы берётся из настроек приложения (DATABASE_URL), а не отсюда.
# Миграции запускает только сервис migrate (python -m app.scripts.init), не воркеры api.
# Команды выполняются из каталога backend: uv run alembic upgrade head | check | revision --autogenerate -m "..."

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
# Имена файлов ревизий: 0001_initial.py, 0002_….py
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-7s %(name)s: %(message)s
datefmt = %Y-%m-%dT%H:%M:%S%z
