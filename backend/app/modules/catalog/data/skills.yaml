# Справочник навыков (Арх. 5.4, 6.14; приложение B, §1.3; приложение A, §3).
#
# code            — [a-z0-9_]{2,40}, неизменяемый; на него ссылаются тесты, профили и подборки.
# kind            — language | framework | database | tool | platform | concept | practice | soft.
# specializations — коды специализаций для голосования за специализацию текста (первая — основная, голос 1.0;
#                   остальные — 0.5). Общие навыки (git, docker, linux) и софт-навыки голосов не дают.
# aliases         — в нижнем регистре; русские — в именительном падеже (леммы вычисляет textparse).
#                   Алиас уникален во всём справочнике.
# case_aliases    — короткие неоднозначные названия: совпадение по точному регистру и только в перечислении.
# implies         — навыки, владение которыми следует из этого (граф без циклов, глубина ≤ 3).
#
# Обязательно присутствуют: все `direct` и `related` из таблицы Арх. 5.4, все `skill_tags` семейств заданий
# (приложение A, §3), коды ФСП (Арх. 7.6), около 20 софт-навыков. Это проверяет tests/catalog.

